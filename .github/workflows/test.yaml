name: Build-Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch: 

jobs:
  Linter:
    runs-on: ubuntu-latest

    steps:
      - name: checkout repo
        uses: actions/checkout@v7

      - name: set up java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: linter
        run: mvn -B checkstyle:check
        
        
  Test-Code_Coverage:
    needs: Linter
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{matrix.os}}
    permissions: 
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: checkout repo
        uses: actions/checkout@v7
        
      - name: set up java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Test
        run: mvn -B test --file pom.xml


      - name: Publish Test Results (ubuntu)
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: ${{ !cancelled() && runner.os == 'Linux'}}
        with:
          files: target/surefire-reports/TEST-*.xml
          check_name: Test Results (${{ matrix.os}})

      - name: Publish Test Results (macOS)
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        uses: EnricoMi/publish-unit-test-result-action/macos@v2
        with:
          files: target/surefire-reports/TEST-*.xml
          check_name: Test Results (${{ matrix.os}})


      - name: Publish Test Results (windows)
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        uses: EnricoMi/publish-unit-test-result-action/windows@v2         
        with:
          files: target/surefire-reports/TEST-*.xml
          check_name: Test Results (${{ matrix.os}})



  Build:
    needs: Test-Code_Coverage
    runs-on: ubuntu-latest
    
    steps:
      - name: checkout repo
        uses: actions/checkout@v7

      - name: set up java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build - jacoco xml
        run: mvn -B -DskipTests verify --file pom.xml

      - name: Upolad Jar
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: Library_jar
          path: target/*.jar
          if-no-files-found: error


  Deploy:
    needs: Build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: checkout repo
        uses: actions/checkout@v7

      - name: set up java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: azure
          server-username-env-var: MAVEN_USERNAME
          server-password-env-var: MAVEN_TOKEN
          settings-path: ${{github.workspace}}
      
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: Library_jar
          path: target/

      - name: Deploy artifact
        run: |
          mvn -B deploy:deploy-file \
            -Dfile=target/Library_Management_System-1.0-SNAPSHOT.jar \
            -DpomFile=pom.xml \
            -DrepositoryId=azure \
            -Durl="https://pkgs.dev.azure.com/tsoukoulis/8df8af67-225d-480d-b726-16b24bfd71cd/_packaging/maven-test/maven/v1" \
            -s "$GITHUB_WORKSPACE/settings.xml"
        env: 
          MAVEN_USERNAME: ${{secrets.MAVEN_USERNAME}}
          MAVEN_TOKEN: ${{secrets.MAVEN_TOKEN}}
          
                





        
    
