name: build

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  build-jar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        
      - name: Set Up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Build jar
        run: mvn -B package --file pom.xml
