name: CI/CD


on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'

jobs:
  Linter:
    runs-on: ubuntu-latest

    steps:
      - name: checkout repo
        uses: actions/checkout@v7

      - name: set up java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Linter
        run: mvn -B checkstyle:check


  Test-Code_Coverage:
    needs: Linter
    strategy:
      matrix: 
        os: [ubuntu-latest, windows-latest, macos latest]

    runs-on: ${{matrix.os}}
    permissions: 
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: checkout repo
        uses: actions/checkout@v7

      - name: set up java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Run Tests-Code_Coverage
        run: mvn -B test --file pom.xml

      - name: upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: jacoco.xml
          path: target/site/jacoco/jacoco.xml


      - name: Publish Test Results (macOS)
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: (!cancelled() && runner.os == 'macOS')
        with:
          files: target/surefire-reports/TEST-*.xml

      - name: Publish Test Results (WIindows)
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: (!cancelled() && runner.os == 'Windows')
        with:
          files: target/surefire-reports/TEST-*.xml

            
  Build-Jar:
    needs: Test-Code_Coverage
    runs-on: ubuntu-latest

    steps:
      - name: checkout repo
        uses: actions/checkout@v7

      - name: set up java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Build Jar
        run: mvn -B -DskipTests verify --file pom.xml

      - name: upload jar
        uses: actions/upload-artifact@v7
        with:
          name: app.jar
          path: target/Library_Management_System-1.0-SNAPSHOT.jar




  Deploy:
    needs: Build-Jar
    runs-on: ubuntu-latest

    steps:
      - name: checkout repo
        uses: actions/checkout@v7

      - name: set up java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          server-username-env-var: MAVEN_USERNAME
          server-password-env-var: MAVEN_TOKEN
          server-id: azure
          settings-path: ${{github.workflow}}

      - name: Download jar
        uses: actions/download-artifact@v8
        with:
          name: app.jar
          path: target/

      - name: Deploy to maven repo
        run: |
            mvn -B deploy:deploy-file \
            -Dfile=target/Library_Management_System-1.0-SNAPSHOT.jar \
            -DpomFile=pom.xml \
            -DrepositoryId=azure \
            -Durl="https://pkgs.dev.azure.com/tsoukoulis/8df8af67-225d-480d-b726-16b24bfd71cd/_packaging/maven-test/maven/v1" \
            -s "$GITHUB_WORKSPACE/settings.xml"
        env:
          MAVEN_PASSWORD: ${{secrets.MAVEN_PASSWORD}}
          MAVEN_TOKEN: ${{secrets.MAVEN_TOKEN}}
      

 
          

        


    
      
    
