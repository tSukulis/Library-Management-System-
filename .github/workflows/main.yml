name: CI/CD

on:
  push:
    branches: [main]
    paths-ignore: 
      -  '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore: 
      -  '**/*.md'

jobs:

  Linter:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@v7
        
      - name: set up java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run Linter
        run: mvn checkstyle:check


  Tests-Code_Coverage:
    needs: Linter
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{matrix.os}}
    permissions: 
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: checkout repo
        uses: actions/checkout@v7
        
      - name: set up java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run Tests
        run: mvn -B test --file pom.xml

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: jacoco.xml
          path: target/site/jacoco/jacoco.xml
          if-no-files-found: error

      - name: Publish Test Results (Linux)
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: ${{ !cancelled() && runner.os == 'Linux'}}
        with:
          files: target/surefire-reports/TEST-*.xml
          check_name: Test Results (${{ matrix.os}})


      - name: Publish Test Results (Windows)
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: ${{ !cancelled() && runner.os == 'Windows'}}
        with:
          files: target/surefire-reports/TEST-*.xml
          check_name: Test Results (${{ matrix.os}})


      - name: Publish Test Results (macOS)
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: ${{ !cancelled() && runner.os == 'macOS'}}
        with:
          files: target/surefire-reports/TEST-*.xml           
          check_name: Test Results (${{ matrix.os}})

  Build-Jar:
    runs-on: ubuntu-latest

    steps:
      - name: checkout repo
        uses: actions/checkout@v7
        
      - name: set up java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build Jar
        run: mvn -B -DskipTests verify --file pom.xml

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: app.jar
          path: target/Library_Management_System-1.0-SNAPSHOT.jar
          if-no-files-found: error


  Deploy:
      needs: Build-Jar
      if: github.event_name == 'push'
      runs-on: ubuntu-latest

      steps:
        - name: checkout repo
          uses: actions/checkout@v7
        
        - name: set up java
          uses: actions/setup-java@v6
          with:
            distribution: temurin
            java-version: '25'
            cache: maven
            server-id: azure
            server-username-env-var: MAVEN_USERNAME
            server-password-env-var: MAVEN_TOKEN
            settings-path: ${{github.workspace}}

        - name: Download artifact
          uses: actions/download-artifact@v8
          with:
            name: app.jar
            path: target/
            
        - name: Deploy
          run: |
            mvn -B deploy:deploy-file \
            -Dfile=target/Library_Management_System-1.0-SNAPSHOT.jar \
            -DpomFile=pom.xml \
            -DrepositoryId=azure \
            -Durl="https://pkgs.dev.azure.com/tsoukoulis/8df8af67-225d-480d-b726-16b24bfd71cd/_packaging/maven-test/maven/v1" \
            -s "$GITHUB_WORKSPACE/settings.xml"
          env:
            MAVEN_PASSWORD: ${{secrets.MAVEN_PASSWORD}}
            MAVEN_TOKEN: ${{secrets.MAVEN_TOKEN}}


    
